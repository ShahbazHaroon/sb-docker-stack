services:

  mysql:
    image: mysql:8.0
    container_name: ${APP_NAME:-app}_mysql

    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USER}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password

    ports:
      - "${DB_PORT:-3306}:3306"

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "--silent" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - docker_stack_network

    restart: unless-stopped

    secrets:
      - mysql_password

  app:
    build:
      context: .
      dockerfile: Dockerfile.multi
    container_name: ${APP_NAME:-app}_spring

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "${APP_PORT:-8080}:8080"

    networks:
      - docker_stack_network

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

    restart: unless-stopped

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:${DB_PORT}/${DB_DATABASE}${DB_JDBC_OPTS}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      JAVA_OPTS: ${JAVA_OPTS}

    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/sb-docker-stack/api/v1/status || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

    # Spring Boot does NOT natively read _FILE env vars.
    # This entrypoint reads the secret file and injects it as the real env var.
    entrypoint:
      - sh
      - -c
      - |
        export SPRING_DATASOURCE_PASSWORD=$(cat /run/secrets/mysql_password)
        exec java $JAVA_OPTS -jar app.jar

    secrets:
      - mysql_password

volumes:
  mysql_data:

networks:
  docker_stack_network:
    name: docker_stack_network
    driver: bridge

secrets:
  mysql_password:
    file: ./secrets/mysql_password.txt
